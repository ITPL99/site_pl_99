services:
  pl99-app:
    build: .
    container_name: pl99-backend
    hostname: backend
    ports:
      - "8080:8080"
    depends_on:
      - db
      - minio
    environment:
      # Spring Profile - production mode
      - APP_PROFILE=local
      - DB_PASS=postgres_pl_99
      # Database connection (using hostname 'db')
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/site_pl_99
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres_pl_99
      # MinIO connection (using hostname 'minio')
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS-KEY=minioadmin
      - MINIO_SECRET-KEY=minio_pl_99
      - MINIO_BUCKET_NAME_IMAGESNEWS=images-news
      - MINIO_BUCKET_NAME_VIDEO=video
      - MINIO_BUCKET_NAME_AVATAR=avatar
    networks:
      - pl99-network

  db:
    image: postgres:15-alpine
    container_name: pl99-database
    hostname: db
    ports:
      # Expose PostgreSQL for local access (host:container)
      - "5432:5432"
    environment:
      - POSTGRES_DB=site_pl_99
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pl_99
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pl99-network

  minio:
    image: minio/minio:latest
    container_name: pl99-minio
    hostname: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_pl_99
    volumes:
      - minio-data:/data
    command:
      - server
      - --console-address
      - ":9001"
      - /data
    networks:
      - pl99-network

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  pl99-network:
    driver: bridge
    # Docker DNS automatically resolves hostnames within this network
    # Services can reach each other by: backend, db, minio