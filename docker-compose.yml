services:
  pl99-app:
    image: pl99-application:latest
    ports:
      - 8080:8080
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/site_pl_99
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres_pl_99
      - MINIO_URL=http://172.17.0.3:9000
      - MINIO_ACCESS-KEY=minioadmin
      - MINIO_SECRET-KEY=minio_pl_99
      - MINIO_BUCKET_NAME_IMAGESNEWS=images-news
      - MINIO_BUCKET_NAME_VIDEO=video
      - MINIO_BUCKET_NAME_AVATAR=avatar
    networks:
      custom_net:
        ipv4_address: 172.17.0.10




  db:
    image: postgres
    environment:
      - POSTGRES_DB=site_pl_99
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pl_99
    networks:
      custom_net:
        ipv4_address: 172.17.0.2


  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_pl_99
    volumes:
      - minio-data:/data
    command:
      - server
      - --console-address
      - ":9001"
      - /data
    networks:
      custom_net:
        ipv4_address: 172.17.0.3

volumes:
  minio-data:


networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.17.0.0/24